name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    name: check-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  rust-check:
    name: rust-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native packages
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Install launch-open E2E dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --locked
          npm ci --prefix tests/e2e
      - name: Test launch-time file open through the native process entry point
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum npm run test:launch-open --prefix tests/e2e
