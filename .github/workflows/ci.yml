name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    name: check-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
