name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    name: check-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  rust-check:
    name: rust-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native packages
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Install launch-open E2E dependencies
        # tauri-driver doesn't support macOS at all (drives WebKitWebDriver on
        # Linux and WebView2's msedgedriver on Windows); this is the only
        # automated coverage of the "Open with Atrium" warm path (R2 in the
        # Windows path-canonicalization plan), so running it on Windows too
        # — not only Linux — is what actually catches a regression there.
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: |
          cargo install tauri-driver --locked
          npm ci --prefix tests/e2e
      - name: Install msedgedriver (Windows)
        # tauri-driver shells out to msedgedriver.exe via $PATH on Windows,
        # the same way it relies on the apt-installed WebKitWebDriver being
        # on $PATH on Linux — neither ships with tauri-driver itself.
        # msedgedriver-tool is Tauri's own documented CI tool for this: it
        # detects the runner's installed Edge/WebView2 build and downloads
        # the matching driver, avoiding a hardcoded version that would drift
        # out of sync with the runner image over time.
        if: runner.os == 'Windows'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - name: Test launch-time file open through the native process entry point (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum npm run test:launch-open --prefix tests/e2e
      - name: Test launch-time file open through the native process entry point (Windows)
        # No Xvfb equivalent needed or available on the Windows runner image;
        # `tauri-driver`/WebView2 run directly against its own real session.
        # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS forces WebView2's software
        # (ANGLE/WARP) renderer: the runner has no real GPU, and WebView2's
        # own GPU process crashing on launch in that situation is a
        # documented cause of msedgedriver's "DevToolsActivePort file
        # doesn't exist" session-creation failure.
        if: runner.os == 'Windows'
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --disable-gpu --use-angle=warp
        run: npm run test:launch-open --prefix tests/e2e
