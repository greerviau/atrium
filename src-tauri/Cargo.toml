[package]
name = "atrium"
version = "0.1.0"
description = "Atrium: a cross-platform markdown editor, code editor, file explorer, and terminal"
authors = ["Atrium contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
async-trait = "0.1"
portable-pty = "0.8"
notify = "6"
notify-debouncer-full = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "1"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
memchr = "2"
nucleo-matcher = "0.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
libc = "0.2"
tempfile = "3"
csv = "1.3"
parquet = { version = "59.1.0", default-features = false, features = ["snap", "flate2-rust_backend", "zstd", "lz4"] }
sqlparser = "0.62.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDocumentController", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSURL"] }
tauri-utils = "2"

# Second-open handoff on macOS already routes through Launch Services into
# `RunEvent::Opened`, so this plugin would add no capability there — only an
# unauthenticated `/tmp` domain socket (see `main.rs` and `commands/fs.rs`).
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[target."cfg(unix)".dependencies]
same-file = "1.0.6"

[target."cfg(windows)".dependencies]
file-id = "0.2.3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
